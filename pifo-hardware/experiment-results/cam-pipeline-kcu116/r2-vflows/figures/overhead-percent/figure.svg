   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="93.047344" y="394.272" transform="rotate(-0 93.047344 394.272)">CAM capacity = 2 × vFlows per bank; 128 entries per stage; controller FIFO = 256.</text>
