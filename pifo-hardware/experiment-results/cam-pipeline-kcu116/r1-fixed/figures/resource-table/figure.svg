  </g>
  <g id="text_43">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="353.952" transform="rotate(-0 7.2 353.952)">Totals = RIO synthesis + 5 × measured PIFO. Overhead = difference / ordinary total. % target = total / FPGA resource capacity.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="370.8864" transform="rotate(-0 7.2 370.8864)">BRAM targets: KCU116 XCKU5P = 480 BRAM36 equivalents. Values above 100% exceed capacity; no placement or routing.</text>
  </g>
  <g id="text_45">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="388.224" transform="rotate(-0 7.2 388.224)">Vivado BRAM36 equivalents = RAMB36 + RAMB18 / 2; capacity comes from the native target report.  — = capacity not reported.</text>
  </g>
 </g>
</svg>
